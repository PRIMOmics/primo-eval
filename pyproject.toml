[project]
name = "primomics"
version = "0.1.1"
description = "Evaluation harness, task specs and baselines for the PRIMO benchmark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.10",
    "gradio-client>=1.0,<2",
    "huggingface-hub>=0.33",
    "joblib",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scikit-learn>=1.9,<1.10",
    "scipy",
]

[project.scripts]
primo = "primomics.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
".claude/hooks/*.py" = ["BLE001"]
"space/*.py" = [
    "B023",
    "ISC004",
    "LOG015",
    "PYI034",
    "RUF046",
    "RUF100",
    "SIM117",
    "UP017",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["space", "scripts"]
