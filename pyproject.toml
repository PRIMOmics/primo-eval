[project]
name = "primomics"
version = "0.1.0.dev0"
description = "Evaluation harness, task specs and baselines for the PRIMO benchmark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "joblib",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scikit-learn>=1.7,<1.10",
    "scipy",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
".claude/hooks/*.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
